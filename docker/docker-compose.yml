services:
  starlane-notes:
    image: ${STARLANE_IMAGE:-ghcr.io/thetxeagle/starlanenotes:latest}
    container_name: starlane-notes
    restart: unless-stopped
    ports:
      - "9320:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ./storage
        target: /data
        bind:
          create_host_path: false
    env_file:
      - .env
