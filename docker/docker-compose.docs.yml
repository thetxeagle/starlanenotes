services:
  starlane-notes-docs:
    image: ${STARLANE_DOCS_IMAGE:-ghcr.io/hbftechnologies/starlanenotes-docs:latest}
    build:
      context: ..
      dockerfile: docker/docs.Dockerfile
    container_name: starlane-notes-docs
    restart: unless-stopped
    ports:
      - "${STARLANE_DOCS_PORT:-9321}:8080"
